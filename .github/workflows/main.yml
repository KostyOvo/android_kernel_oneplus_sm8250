name: Build OnePlus sm8250 Kernel (8-Core)

on:
  workflow_dispatch:  # 仅手动触发，避免误编译
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须完整历史（内核编译依赖 git 信息）

      - name: 🛠️ Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg libssl-dev libelf-dev libncurses-dev \
            liblz4-tool rsync unzip wget xz-utils zlib1g-dev

      - name: 📦 Setup Toolchains
        run: |
          # Clang (Google NDK r27c)
          wget -q https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/releases/download/clang-r487747c/clang-r487747c-linux-x86_64.tar.xz
          tar -xf clang-r487747c-linux-x86_64.tar.xz -C $HOME
          
          # GCC (aarch64)
          wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/releases/download/v2023.01/aarch64-linux-android-4.9-linux-x86_64.tar.xz
          tar -xf aarch64-linux-android-4.9-linux-x86_64.tar.xz -C $HOME
          
          echo "CLANG_PATH=$HOME/clang-r487747c" >> $GITHUB_ENV
          echo "GCC_PATH=$HOME/aarch64-linux-android-4.9" >> $GITHUB_ENV

      - name: 🔧 Configure Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$CLANG_PATH/bin:$GCC_PATH/bin:$PATH"
          
          make O=out vendor/kona-perf_defconfig

      - name: ⚙️ Compile Kernel (-j10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$CLANG_PATH/bin:$GCC_PATH/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          make O=out -j10  # 严格按需求：10 线程编译

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-sm8250-Kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dts/qcom/*.dtb
          retention-days: 7

